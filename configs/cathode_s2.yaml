# configs/cathode_s2.yaml
# =========================
# ⚠️ DESCOPED 2026-07 per Prof. Jin -- DO NOT USE FOR TRAINING ⚠️
#
# Sample 2 (LSCF+GDC/SCT bilayer) is descoped as a training source.
# Reason: SCT is an extra film layer not representative of the target cathode.
# S1 (cathode_s1_supercrop.yaml) is the sole cathode training source.
#
# This file is retained as a stub to preserve the label-map knowledge from
# the inspection (NEW_DATASET_INSPECTION.md, NEW_DATASET_PPTX_NOTES.md).
# Do NOT pass this config to extract_cubes.py or any training pipeline.
#
# Label identities (from NEW_DATASET_PPTX_NOTES.md, PPTX slides 2 and 4):
#   S2_GDC_LSCF_SCT_Rectangle.tif (274x215x166, labels 0-3):
#     label=0: Pore  (53.0% of voxels)
#     label=1: GDC   (29.3%)
#     label=2: LSCF  (11.1%)
#     label=3: SCT   ( 6.6%) -- SrCo0.9Ta0.1O3-d, MIEC capping layer
#   S2_MATBOX.tif (304x229x227):
#     val=5: Background padding (41.0%)
#     val=0: Pore (21.4%)
#     val=88: SCT (24.6%)  ← large SCT region in bilayer geometry
#     val=171: GDC (8.3%)
#     val=254: LSCF (4.7%)

name: cathode_s2
descoped: true
descoped_reason: "Per Prof. Jin 2026-07: SCT extra film layer, not representative. S1 only."

# Phase definitions retained for documentation (not for active use)
phases:
  - channel: 0
    name: LSCF
    bmp_value: 255
    role: electron_conductor
  - channel: 1
    name: GDC
    bmp_value: 127
    role: ion_conductor
  - channel: 2
    name: Pore
    bmp_value: 0
    role: gas

voxel_size_um:
  x: null
  y: null
  z: null

source_file_key: cathode_s2_sct_tif

source_label_map:
  0: Pore
  1: GDC
  2: LSCF
  3: SCT      # excluded; 4th phase (capping layer)

exclude_values:
  - 3         # SCT excluded

metric_policy:
  reaction_site: DESCOPED
  tau_scored: false
